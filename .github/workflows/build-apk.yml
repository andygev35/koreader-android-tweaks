name: Build APK

on:
  workflow_dispatch:
    inputs:
      koreader_version:
        description: 'KOReader version tag (e.g. v2026.07.1)'
        required: true
      arch:
        description: 'Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
  push:
    tags:
      - 'build-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get install -y --no-install-recommends unzip zip p7zip-full python3
          cd /tmp
          sudo apt-get download apksigner zipalign libapksig-java \
            android-libziparchive android-libutils android-libcutils \
            android-libbase android-liblog android-libbacktrace libzopfli1
          sudo dpkg -i --force-depends *.deb
          which apksigner zipalign

      - name: Install luajit (for syntax-checking patched files)
        run: sudo apt-get install -y luajit

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.koreader_version }}" >> "$GITHUB_OUTPUT"
            echo "arch=${{ github.event.inputs.arch }}" >> "$GITHUB_OUTPUT"
          else
            # push tag like "build-v2026.07.1-arm64"
            raw="${GITHUB_REF#refs/tags/build-}"
            echo "tag=${raw%-*}" >> "$GITHUB_OUTPUT"
            echo "arch=${raw##*-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore or generate signing keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d -i > apk/gpuslide-debug.keystore
            # Sanity-check: a real JKS/PKCS12 keystore is never this small.
            # Catches silent corruption (e.g. an empty or garbled secret)
            # before it causes a confusing failure deeper in the build.
            size=$(stat -c%s apk/gpuslide-debug.keystore 2>/dev/null || stat -f%z apk/gpuslide-debug.keystore)
            if [ "$size" -lt 500 ]; then
              echo "::error::Decoded keystore is suspiciously small ($size bytes) -- SIGNING_KEYSTORE_B64 secret is likely corrupted. Re-copy it with: base64 -i apk/gpuslide-debug.keystore | pbcopy"
              exit 1
            fi
          else
            echo "No SIGNING_KEYSTORE_B64 secret set -- build.sh will generate a fresh one."
            echo "NOTE: without a persisted keystore, every CI build signs with a"
            echo "different key, meaning installs won't upgrade in place between"
            echo "CI-built releases either. Add the secret for consistent signing."
          fi

      - name: Build
        run: |
          cd apk
          chmod +x build.sh
          ./build.sh "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreader-${{ steps.version.outputs.arch }}-gpuslide-${{ steps.version.outputs.tag }}
          path: apk/koreader-*-gpuslide-*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/build-')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/koreader-*-gpuslide-*.apk
          body: |
            Built against KOReader ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.arch }}).

            **Signed with a throwaway key, not KOReader's official one.**
            If you have KOReader installed already, uninstall it first
            (`adb uninstall org.koreader.launcher`) -- Android won't
            upgrade in place over a mismatched signature. Your library
            and settings in `/sdcard/koreader/` are untouched by the
            uninstall.

            See KNOWN_ISSUES.md before relying on this.
